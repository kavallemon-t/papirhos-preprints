site_name: Papirhos Preprints
site_url: https://kavallemon-t.github.io/papirhos-preprints
theme:
  name: material
  custom_dir: docs/overrides
  language: es
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.tabs
extra_css:
 - stylesheets/extra.css
 - stylesheets/media.css
nav:
 - Inicio: index.md
 - Preprints: preprints.md
 - Búsqueda avanzada: explorar.md
 - Acerca de: acerca.md
 - TUL: tul.md
 - Contacto: contacto.md
markdown_extensions:
 - admonition
 - pymdownx.details
 - pymdownx.superfences
extra_javascript:
 - js/config.js

